/* =========================================================
   PEAK LINEUP STYLEGUIDE
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --black: #111111;

    --medium: #777777;

    --radius: 12px;
    --radius-small: 7px;

    --max-width: 1440px;

   RESET
   --------------------------------------------------------- */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', Arial, sans-serif;

    color: var(--black);

    max-width: 100%;

}

input,
select {
    font: inherit;
}

   NAVIGATION
   --------------------------------------------------------- */

.topbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5vw;

    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid var(--border);
