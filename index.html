<!DOCTYPE html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Lineup</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Peak Lineup</div>
    <nav class="nav-links">
      <a href="#">Rent</a>
      <a href="#">Buy</a>
      <a href="#">Travel</a>
    </nav>
  </header>

  <main class="container">

    <section class="section">
      <h2 class="section-title">Peak Locations</h2>
      <div class="card-grid locations-grid">
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Location 1</p>
        </div>
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Location 2</p>
        </div>
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Location 3</p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Peak Boards</h2>
      <div class="card-grid boards-grid">
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Board 1</p>
        </div>
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Board 2</p>
        </div>
        <div class="card-wrapper">
          <div class="card"></div>
          <p class="card-label">Board 3</p>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
