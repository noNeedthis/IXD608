<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waikiki, Oahu - Book Filming | Peak Lineup</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }

        /* Custom styling for sleek select arrows */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%204b5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.25rem center;
            background-size: 1.25em;
        }

        /* Styling for native date input picker button */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            padding: 4px;
            filter: invert(0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Brand Logo -->
            <a href="index.html" class="flex items-center gap-2 group">
                <span class="text-2xl font-extrabold tracking-tight text-gray-900 group-hover:text-blue-600 transition-colors uppercase">
                    PEAK LINEUP
                </span>
            </a>

            <!-- Desktop 4 Main Tabs -->
            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
                <a href="index.html" class="px-4 py-2 rounded-full text-sm font-semibold bg-gray-900 text-white transition-all shadow-sm">
                    Filming
                </a>
                <a href="#" class="px-4 py-2 rounded-full text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all">
                    Upload
                </a>
                <a href="#" class="px-4 py-2 rounded-full text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all">
                    Rankings
                </a>
                <a href="#" class="px-4 py-2 rounded-full text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-all">
                    Account
                </a>
            </nav>

            <!-- Mobile Menu Toggle Button -->
            <div class="md:hidden">
                <button id="mobile-menu-btn" class="p-2 text-gray-600 hover:text-gray-900 focus:outline-none">
                    <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden border-b border-gray-100 bg-white px-4 pt-2 pb-4 space-y-2">
            <a href="index.html" class="block px-4 py-2.5 rounded-xl text-base font-semibold bg-gray-900 text-white">
                Filming
            </a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-100">
                Upload
            </a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-100">
                Rankings
            </a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-base font-semibold text-gray-600 hover:bg-gray-100">
                Account
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-20 flex-grow w-full">
        
        <!-- Breadcrumb / Back Navigation -->
        <div class="mb-6">
            <a href="index.html" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2 text-xs"></i> Back to Destinations
            </a>
        </div>

        <!-- Location Page Heading -->
        <div class="mb-8 sm:mb-10 text-center sm:text-left">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
                Waikiki, Oahu
            </h1>
            <p class="text-gray-500 text-base mt-2">
                Configure your filming session details below.
            </p>
        </div>

        <!-- Booking Form Card -->
        <div class="bg-gray-50/80 border border-gray-200/80 rounded-3xl p-6 sm:p-8 md:p-10 shadow-sm">
            <form id="booking-form" class="space-y-6 sm:space-y-8" onsubmit="handleConfirm(event)">
                
                <!-- 1. Pick your specific beach -->
                <div>
                    <label for="beach-select" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-2">
                        Pick your specific beach
                    </label>
                    <div class="relative">
                        <select 
                            id="beach-select" 
                            required 
                            class="w-full bg-white border border-gray-300 rounded-2xl px-5 py-4 text-gray-800 font-medium text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer shadow-sm"
                        >
                            <option value="" disabled selected>Select a break / surf spot</option>
                            <option value="queens">Queens</option>
                            <option value="canoes">Canoes</option>
                            <option value="publics">Publics</option>
                            <option value="bowls">Alawai Bowls</option>
                        </select>
                    </div>
                </div>

                <!-- 2. Specific package -->
                <div>
                    <label for="package-select" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-2">
                        Specific package
                    </label>
                    <div class="relative">
                        <select 
                            id="package-select" 
                            required 
                            class="w-full bg-white border border-gray-300 rounded-2xl px-5 py-4 text-gray-800 font-medium text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer shadow-sm"
                        >
                            <option value="" disabled selected>Select a package option</option>
                            <option value="beach-75">Beach Filming — $75</option>
                            <option value="water-100">Water Filming — $100</option>
                            <option value="full-150">Full Session Package — $150</option>
                        </select>
                    </div>
                </div>

                <!-- 3. Date -->
                <div>
                    <label for="date-select" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-2">
                        Date
                    </label>
                    <input 
                        type="date" 
                        id="date-select" 
                        required 
                        class="w-full bg-white border border-gray-300 rounded-2xl px-5 py-4 text-gray-800 font-medium text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer shadow-sm"
                    >
                </div>

                <!-- 4. Time -->
                <div>
                    <label for="time-select" class="block text-sm font-bold text-gray-900 uppercase tracking-wider mb-2">
                        Time Slot (1 Hour)
                    </label>
                    <div class="relative">
                        <select 
                            id="time-select" 
                            required 
                            class="w-full bg-white border border-gray-300 rounded-2xl px-5 py-4 text-gray-800 font-medium text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all cursor-pointer shadow-sm"
                        >
                            <option value="" disabled selected>Choose a 1-hour time window</option>
                            <option value="06:00-07:00">6:00 AM – 7:00 AM</option>
                            <option value="07:00-08:00">7:00 AM – 8:00 AM</option>
                            <option value="08:00-09:00">8:00 AM – 9:00 AM</option>
                            <option value="09:00-10:00">9:00 AM – 10:00 AM</option>
                            <option value="10:00-11:00">10:00 AM – 11:00 AM</option>
                            <option value="11:00-12:00">11:00 AM – 12:00 PM</option>
                            <option value="12:00-13:00">12:00 PM – 1:00 PM</option>
                            <option value="13:00-14:00">1:00 PM – 2:00 PM</option>
                            <option value="14:00-15:00">2:00 PM – 3:00 PM</option>
                            <option value="15:00-16:00">3:00 PM – 4:00 PM</option>
                            <option value="16:00-17:00">4:00 PM – 5:00 PM</option>
                            <option value="17:00-18:00">5:00 PM – 6:00 PM</option>
                        </select>
                    </div>
                </div>

                <!-- Confirmation Action Section -->
                <div class="pt-4 border-t border-gray-200/80">
                    <button 
                        type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold text-lg py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center gap-3"
                    >
                        <span>Confirm & Continue to Checkout</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-100 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-xs text-gray-500 font-medium">
                &copy; 2026 PEAK LINEUP. All rights reserved.
            </p>
            <div class="flex items-center space-x-6 text-xs text-gray-400">
                <a href="#" class="hover:text-gray-600 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-gray-600 transition-colors">Terms of Service</a>
                <a href="#" class="hover:text-gray-600 transition-colors">Contact Support</a>
            </div>
        </div>
    </footer>

    <!-- Interactive Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile Menu Toggle
            const menuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');

            if (menuBtn && mobileMenu) {
                menuBtn.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                    if (mobileMenu.classList.contains('hidden')) {
                        menuIcon.classList.remove('fa-xmark');
                        menuIcon.classList.add('fa-bars');
                    } else {
                        menuIcon.classList.remove('fa-bars');
                        menuIcon.classList.add('fa-xmark');
                    }
                });
            }

            // Set minimum selectable date to today
            const dateInput = document.getElementById('date-select');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.setAttribute('min', today);
            }
        });

        // Form Submit Handler
        function handleConfirm(event) {
            event.preventDefault();
            
            const beach = document.getElementById('beach-select').value;
            const pkg = document.getElementById('package-select').value;
            const date = document.getElementById('date-select').value;
            const time = document.getElementById('time-select').value;

            console.log('Booking Selection:', { beach, pkg, date, time });
            
            // Redirects to cart/checkout page (e.g. checkout.html)
            // window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
